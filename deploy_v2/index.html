/* ── Service Worker Registration ── */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js')
      .then(reg => {
        console.log('[App] Service Worker registrado:', reg.scope);
        window._swReg = reg;

        // Detectar actualizaciones
        reg.addEventListener('updatefound', () => {
          const newSW = reg.installing;
          newSW.addEventListener('statechange', () => {
            if (newSW.state === 'installed' && navigator.serviceWorker.controller) {
              console.log('[App] Nueva versión disponible');
              window.dispatchEvent(new CustomEvent('sw-update'));
            }
          });
        });
      })
      .catch(err => console.warn('[App] SW no registrado:', err));
  });
}

/* ── Push Notification helpers (globales) ── */
window.TibiaNotif = {
  // Solicitar permiso de notificaciones
  async requestPermission() {
    if (!('Notification' in window)) return 'unsupported';
    if (Notification.permission === 'granted') return 'granted';
    const result = await Notification.requestPermission();
    return result;
  },

  // Enviar notificación local (via service worker para que aparezca aunque la app esté cerrada)
  async send(title, body, url = '/') {
    if (Notification.permission !== 'granted') return;
    if (navigator.serviceWorker && navigator.serviceWorker.controller) {
      navigator.serviceWorker.controller.postMessage({
        type: 'SHOW_NOTIFICATION', title, body, url,
        tag: 'tibia-market-' + Date.now(),
      });
    } else {
      new Notification(title, { body, icon: '/icons/icon-192.png' });
    }
  },

  // Simular notificación de mensaje nuevo (para demo)
  simulateMessage(sellerName, itemName) {
    setTimeout(() => {
      this.send(
        `💬 Nuevo mensaje de ${sellerName}`,
        `Sobre: ${itemName} — "Hola, ¿el item sigue disponible?"`,
        '/?tab=offers'
      );
    }, 4000);
  },

  // Simular notificación de oferta recibida
  simulateOffer(itemName, price) {
    setTimeout(() => {
      this.send(
        `💰 Nueva oferta en tu listing`,
        `${itemName}: te ofrecen ${price.toLocaleString()} gp`,
        '/?tab=offers'
      );
    }, 6000);
  }
};

const API_URL = "https://tibia-market-backend-production.up.railway.app";  // ej: "https://tibia-market-api.railway.app"

/* ── Session helpers (localStorage) ── */
/* ── PIN hash (Web Crypto) ── */
async function hashPin(pin){
  try{
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("tibia_market_pin_" + pin));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("").slice(0,16);
  }catch{ return pin; } // fallback si no hay crypto
}

const Session = {
  KEY: "tm_session",
  save(data){ try{ localStorage.setItem(Session.KEY, JSON.stringify({...data, savedAt: Date.now()})); }catch{} },
  load(){
    try{
      const raw = localStorage.getItem(Session.KEY);
      if(!raw) return null;
      const data = JSON.parse(raw);
      // Sesión válida por 30 días
      if(Date.now() - data.savedAt > 30*24*60*60*1000){ Session.clear(); return null; }
      return data;
    }catch{ return null; }
  },
  clear(){ try{ localStorage.removeItem(Session.KEY); }catch{} },
};

/* ── API helper ── */
async function api(endpoint, opts={}){
  if(!API_URL) throw new Error("NO_BACKEND");
  const session = Session.load();
  const headers = { "Content-Type":"application/json", "Accept":"application/json" };
  if(session?.token) headers["Authorization"] = `Bearer ${session.token}`;
  const res = await fetch(API_URL + endpoint, {...opts, headers:{...headers,...(opts.headers||{})}});
  if(!res.ok){
    const err = await res.json().catch(()=>({error:`HTTP ${res.status}`}));
    throw new Error(err.error || `HTTP ${res.status}`);
  }
  return res.json();
}

/* ══════════════ LOGIN ══════════════ */
/* ── TibiaData API Real (v4) con fallback proxy ── */
function normalizeVoc(v){
  const m={"Elite Knight":"Knight","Knight":"Knight","Royal Paladin":"Paladin","Paladin":"Paladin","Elder Druid":"Elder Druid","Druid":"Elder Druid","Master Sorcerer":"Master Sorcerer","Sorcerer":"Master Sorcerer","Monk":"Monk","None":"Sin vocación"};
  return m[v]||v;
}

function parseCharData(data){
  try{
    let json = data;
    if(typeof data === "string"){ try{ json=JSON.parse(data); }catch{ return null; } }
    if(json?.contents){ try{ json=JSON.parse(json.contents); }catch{ return null; } }
    const char = json?.character?.character;
    if(!char || !char?.name) return null;
    return {
      name:   char?.name    || "",
      world:  char?.world   || "",
      voc:    normalizeVoc(char?.vocation || ""),
      level:  char?.level   || 1,
      guild:  char?.guild?.name || null,
      online: char?.status === "online",
    };
  } catch(e){ return null; }
}

async function fetchWithTimeout(url, opts={}, ms=9000){
  const ctrl = new AbortController();
  const id = setTimeout(()=>ctrl.abort(), ms);
  try{
    const res = await fetch(url,{...opts, signal:ctrl.signal});
    clearTimeout(id);
    return res;
  }catch(e){ clearTimeout(id); throw e; }
}

async function fakeAPICheck(name){
  if(!name||!name.trim()) return null;
  const charName = name.trim();

  // Intento 1: Railway backend (más confiable, sin CORS)
  if(API_URL){
    try{
      const res = await fetchWithTimeout(
        `${API_URL}/api/auth/verify`,
        { method:"POST", headers:{"Content-Type":"application/json","Accept":"application/json"},
          body: JSON.stringify({characterName: charName}) }
      );
      if(res.status===404) return null;
      if(res.ok){
        const data = await res.json();
        if(data?.character) return {
          name:   data.character?.name   || "",
          world:  data.character?.world  || "",
          voc:    data.character?.vocation || data.character?.voc || "",
          level:  data.character?.level  || 1,
          guild:  data.character?.guild  || null,
          online: false,
          hasAccount: data.hasAccount,
        };
      }
    }catch(e){
      console.warn("[Verify] Backend falló, intentando Netlify fn...", e.message);
    }
  }

  // Intento 2: Netlify Function
  try{
    const netlifyURL = `/.netlify/functions/tibia?name=${encodeURIComponent(charName)}`;
    const res = await fetchWithTimeout(netlifyURL,{headers:{"Accept":"application/json"}});
    if(res.status===404) return null;
    if(res.ok){
      const data = await res.json();
      const parsed = parseCharData(data);
      if(parsed!==undefined) return parsed;
    }
  }catch(e){
    console.warn("[Verify] Netlify fn falló...", e.message);
  }

  // Intento 3: proxy público
  const directURL = `https://api.tibiadata.com/v4/character/${encodeURIComponent(charName)}`;
  const proxyURL  = `https://api.allorigins.win/get?url=${encodeURIComponent(directURL)}`;
  try{
    const res = await fetchWithTimeout(proxyURL,{headers:{"Accept":"application/json"}});
    if(!res.ok) throw new Error(`Proxy HTTP ${res.status}`);
    const data = await res.json();
    return parseCharData(data);
  }catch(e){
    throw new Error("No se pudo verificar el personaje. Intenta de nuevo.");
  }
}

function LoginScreen({onLogin,onRegister}){
  const [char,setChar]=useState("");
  const [status,setStatus]=useState("idle"); // idle | loading | found | notfound | error | hasAccount
  const [found,setFound]=useState(null);

  async function handleEnter(){
    if(!char.trim()||status==="loading") return;
    setStatus("loading"); setFound(null);
    try{
      const result = await fakeAPICheck(char.trim());
      if(!result){ setStatus("notfound"); return; }
      setFound(result);
      // If they already have an account, log in directly
      if(result.hasAccount){
        setStatus("hasAccount");
        // Auto-login after short delay
        setTimeout(()=>onLogin(result), 800);
      } else {
        setStatus("found"); // new user, show create account
      }
    }catch(e){
      setStatus("error"); setFound({errMsg:e.message});
    }
  }

  function reset(){ setStatus("idle"); setFound(null); setChar(""); }

  const inp={width:"100%",background:"#1A1810",border:`1.5px solid ${status==="notfound"||status==="error"?C.red:status==="found"||status==="hasAccount"?C.green:C.borderGold}`,borderRadius:10,padding:"13px 16px 13px 42px",color:C.text,fontFamily:"'Crimson Text',serif",fontSize:16,outline:"none"};

function NotifBell(){
  const [perm,setPerm]=useState(typeof Notification!=='undefined'?Notification.permission:'default');
  const [pulse,setPulse]=useState(false);

  useEffect(()=>{
    // Pulsar si hay notificación pendiente
    const t=setTimeout(()=>setPulse(true),3000);
    return ()=>clearTimeout(t);
  },[]);

  async function handleClick(){
    if(perm==='granted'){setPulse(false);return;}
    const result=await window.TibiaNotif?.requestPermission();
    setPerm(result||'default');
  }

  return(
    <button onClick={handleClick} title={perm==='granted'?"Notificaciones activas":"Activar notificaciones"}
      style={{background:"none",border:`1px solid ${perm==='granted'?C.green:C.border}`,borderRadius:8,padding:"5px 8px",cursor:"pointer",position:"relative",display:"flex",alignItems:"center",justifyContent:"center"}}>
      <span style={{fontSize:16}}>{perm==='granted'?"🔔":"🔕"}</span>
      {pulse&&perm!=='granted'&&(
        <span style={{position:"absolute",top:-3,right:-3,width:8,height:8,borderRadius:"50%",background:C.red,border:`1.5px solid ${C.bg0}`,animation:"pulse 1.5s infinite"}}/>
      )}
    </button>
  );
}

function ChatScreen({item,onBack,inbox=false,conversations}){

/* ── TIBIA PIXEL-ART SPRITES (SVG, no external deps) ── */
function TibiaSprite({wiki, cat, size=40, bg=true}){
  const [state, setState] = useState("loading"); // loading | ok | err

  // Limpiar el nombre wiki: decodificar, luego re-encodear solo chars necesarios
  function buildUrl(w){
    if(!w) return null;
    // Decodificar %27 -> ' y otros, luego usar como path literal (el servidor lo maneja)
    const clean = w.replace(/%27/gi,"'").replace(/\(/g,"(").replace(/\)/g,")");
    return `https://tibia.fandom.com/wiki/Special:FilePath/${encodeURIComponent(clean)}.gif`;
  }

  const url = buildUrl(wiki);

  const fallbackEmoji = {
    "Espadas":"⚔️","Hachas":"🪓","Mazas":"🔨","Distancia":"🏹",
    "Varitas":"🪄","Bastones":"🌿","Armaduras":"🛡️","Cascos":"⛑️",
    "Pantalones":"👖","Escudos":"🔰","Botas":"👢","Amuletos":"📿",
    "Anillos":"💍","Libros":"📖","Otros":"💎",
  };

  const containerStyle = {
    width: size, height: size, flexShrink: 0,
    display: "flex", alignItems: "center", justifyContent: "center",
    background: bg ? "#1A1810" : "transparent",
    borderRadius: 8, overflow: "hidden",
  };

  if(url && state !== "err"){
    return(
      <div style={containerStyle}>
        {state === "loading" && (
          <span style={{fontSize:size*0.35,opacity:0.3}}>{fallbackEmoji[cat]||"📦"}</span>
        )}
        <img
          src={url}
          alt={cat}
          referrerPolicy="no-referrer"
          onLoad={()=>setState("ok")}
          onError={()=>setState("err")}
          style={{
            width: state==="ok" ? size*0.88 : 0,
            height: state==="ok" ? size*0.88 : 0,
            objectFit:"contain",
            imageRendering:"pixelated",
            display: state==="ok" ? "block" : "none",
          }}
        />
      </div>
    );
  }

  return(
    <div style={containerStyle}>
      <span style={{fontSize:size*0.52,lineHeight:1}}>{fallbackEmoji[cat]||"📦"}</span>
    </div>
  );
}

function AccountScreen({onBack,onLogout,session,myListings}){
  const sessionChar = session?.character;
  const [chars,setChars]=useState(sessionChar
    ? [{name:sessionChar.name,voc:sessionChar.voc||sessionChar.vocation,world:sessionChar.world,level:sessionChar.level,primary:true,active:true}]
    : [{name:"Mi Personaje",voc:"Knight",world:"Antica",level:1,primary:true,active:true}]
  );
  const [addMode,setAddMode]=useState(false);   // show add-char panel
  const [search,setSearch]=useState("");
  const [searchStatus,setSearchStatus]=useState("idle"); // idle|loading|found|notfound
  const [foundChar,setFoundChar]=useState(null);
  const [activeIdx,setActiveIdx]=useState(0);   // which char is "selected" / shown
  const [confirmDel,setConfirmDel]=useState(null); // index to delete

  const active = chars[activeIdx] || chars[0];

  /* fake TibiaData verify */
  async function verifyChar(){
    if(!search.trim()) return;
    setSearchStatus("loading"); setFoundChar(null);
    const exists=chars.find(c=>c.name.toLowerCase()===search.trim().toLowerCase());
    if(exists){setSearchStatus("notfound");setFoundChar({err:"already"});return;}
    try{
      const r=await fakeAPICheck(search.trim());
      if(r){setFoundChar(r);setSearchStatus("found");}
      else{setSearchStatus("notfound");setFoundChar(null);}
    }catch(e){
      setSearchStatus("notfound");
      setFoundChar({err:"connection", msg:e.message});
    }
  }
  function addChar(){
    if(!foundChar) return;
    setChars(prev=>[...prev,{name:foundChar.name,voc:foundChar.voc,world:foundChar.world,level:foundChar.level,primary:false,active:true}]);
    setAddMode(false);setSearch("");setSearchStatus("idle");setFoundChar(null);
  }
  function removeChar(i){
    if(chars[i].primary) return;
    setChars(prev=>prev.filter((_,idx)=>idx!==i));
    if(activeIdx>=i) setActiveIdx(Math.max(0,activeIdx-1));
    setConfirmDel(null);
  }
  function setPrimary(i){
    setChars(prev=>prev.map((c,idx)=>({...c,primary:idx===i})));
    setActiveIdx(i);
  }

  const VOC_ICON={Knight:"⚔️",Paladin:"🏹","Elder Druid":"🌿","Master Sorcerer":"🔮",Sorcerer:"🔮",Monk:"🥷"};
  const VOC_COLOR={Knight:C.blue,Paladin:C.green,"Elder Druid":"#4ADE80","Master Sorcerer":C.purple,Sorcerer:C.purple,Monk:C.gold};

  /* ── ADD CHARACTER PANEL ── */
  if(addMode) return(
    <div style={{display:"flex",flexDirection:"column",height:"100%"}}>
      <TopBar title="AGREGAR PERSONAJE" onBack={()=>{setAddMode(false);setSearch("");setSearchStatus("idle");setFoundChar(null);}}/>
      <div className="scroll-panel" style={{flex:1,padding:"16px 16px 8px",minHeight:0}}>

        <div style={{background:"#141210",border:"1px solid #2A2418",borderRadius:10,padding:"12px 14px",marginBottom:16,fontSize:13,color:C.textSub,fontFamily:"'Crimson Text',serif",lineHeight:1.7}}>
          🧙 Ingresa el nombre exacto de tu personaje en Tibia. Lo verificaremos con la <span style={{color:C.gold}}>TibiaData API</span>.
        </div>

        {searchStatus!=="found"&&(
          <div>
            <div style={{fontSize:12,color:C.textSub,marginBottom:6,fontFamily:"'Cinzel',serif",letterSpacing:0.5}}>Nombre del personaje</div>
            <div style={{display:"flex",gap:8,marginBottom:12}}>
              <input value={search} onChange={e=>{setSearch(e.target.value);setSearchStatus("idle");setFoundChar(null);}}
                onKeyDown={e=>e.key==="Enter"&&verifyChar()}
                placeholder="ej. Gorthax"
                style={{flex:1,background:"#181510",border:`1.5px solid ${searchStatus==="notfound"?"#8B1C1C":search?C.borderGold:"#3A3020"}`,borderRadius:8,padding:"12px 14px",color:C.text,fontFamily:"'Crimson Text',serif",fontSize:15,outline:"none"}}/>

/* ── Exchange rates (base: USD) ── */
const FX={USD:{sym:"$",label:"USD",rate:1,flag:"🇺🇸"},MXN:{sym:"$",label:"MXN",rate:17.2,flag:"🇲🇽"},BRL:{sym:"R$",label:"BRL",rate:5.75,flag:"🇧🇷"}};
function fmtMoney(usd,cur){const r=FX[cur];return `${r.sym}${(usd*r.rate).toFixed(2)} ${r.label}`;}
function fmtMoneyShort(usd,cur){
  const r=FX[cur]; const v=usd*r.rate;
  if(v>=1000) return `${r.sym}${(v/1000).toFixed(1)}k ${r.label}`;
  return `${r.sym}${v.toFixed(2)} ${r.label}`;
}

  );
}

function TCMarketScreen({onBack,onChat,onSell,tcListings,loading}){
  const [cur,setCur]=useState("MXN");
  const [search,setSearch]=useState("");
  const [sortBy,setSortBy]=useState("price");
  const [worldFilter,setWorldFilter]=useState("Todos");
  const worlds=["Todos","Antica","Secura","Refugia","Bona","Gladera"];
  const fx=FX[cur];

  const listings = Array.isArray(tcListings) ? tcListings : [];
  const sorted=[...listings]
    .filter(l=>worldFilter==="Todos"||l.world===worldFilter)
    .filter(l=>(l?.seller||"").toLowerCase().includes(search.toLowerCase()))
    .sort((a,b)=>sortBy==="price"?a.priceUSD-b.priceUSD:sortBy==="amount"?b.amount-a.amount:b.rating-a.rating);

  const best=sorted[0];
  const avgUSD=(Array.isArray(listings)?listings:[]).reduce((a,l)=>a+(l?.priceUSD||0),0)/Math.max(1,listings.length);

  return(
    <div style={{display:"flex",flexDirection:"column",height:"100%"}}>
      {/* header */}

          <button onClick={onBack} style={{background:"none",border:"none",color:C.gold,fontSize:22,padding:0,lineHeight:1}}>←</button>
          <div style={{display:"flex",alignItems:"center",gap:7}}>
            <TCCoin size={20}/>
            <span style={{fontFamily:"'Cinzel',serif",fontWeight:700,fontSize:15,color:C.goldText,letterSpacing:1}}>TIBIA COINS</span>
          </div>
        </div>
        <button onClick={onSell}
          style={{background:`linear-gradient(135deg,${C.gold},${C.goldD})`,border:"none",borderRadius:7,padding:"6px 13px",color:"#1A1000",fontFamily:"'Cinzel',serif",fontSize:11,fontWeight:700,cursor:"pointer"}}>

        {/* currency picker */}
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
          <div style={{fontFamily:"'Cinzel',serif",fontSize:10,color:C.textMuted,letterSpacing:1}}>VER PRECIOS EN</div>
          <CurrencyPicker cur={cur} setCur={setCur}/>
        </div>

        {/* stats */}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:12}}>
          {[
            {l:"Precio prom.",v:fmtMoneyShort(avgUSD,cur),i:"📊",sub:"por TC"},
            {l:"Mejor precio",v:best?fmtMoneyShort(best.priceUSD,cur):"—",i:"💹",sub:"por TC"},
            {l:"Vendedores",  v:listings.length,i:"👥",sub:"activos"},
          ].map(s=>(
            <div key={s.l} style={{background:`linear-gradient(135deg,#1A1408,${C.bg1})`,border:`1px solid ${C.borderGold}`,borderRadius:10,padding:"10px 6px",textAlign:"center"}}>
              <div style={{fontSize:17,marginBottom:3}}>{s.i}</div>
              <div style={{fontFamily:"monospace",fontSize:12,fontWeight:700,color:C.gold,lineHeight:1.1}}>{s.v}</div>
              <div style={{fontFamily:"'Cinzel',serif",fontSize:7,color:C.textMuted,marginTop:3,letterSpacing:0.3}}>{s.l}</div>
              <div style={{fontSize:8,color:C.textMuted}}>{s.sub}</div>
            </div>
          ))}
        </div>

        {/* search */}
        <div style={{position:"relative",marginBottom:8}}>
          <span style={{position:"absolute",left:11,top:"50%",transform:"translateY(-50%)",fontSize:13,color:C.textMuted,pointerEvents:"none"}}>🔍</span>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Buscar vendedor..."

        </div>

        {/* world filter */}
        <div style={{display:"flex",gap:6,marginBottom:8,overflowX:"auto",scrollbarWidth:"none"}}>
          {worlds.map(w=>(
            <button key={w} onClick={()=>setWorldFilter(w)}
              style={{background:worldFilter===w?C.gold:C.bg1,border:`1px solid ${worldFilter===w?C.gold:C.border}`,color:worldFilter===w?"#1A1200":C.textSub,padding:"4px 12px",borderRadius:16,fontFamily:"'Cinzel',serif",fontSize:9,fontWeight:worldFilter===w?700:400,flexShrink:0,transition:"all 0.15s"}}>
              {w}
            </button>
          ))}
        </div>

        {/* sort */}
        <div style={{display:"flex",gap:5,marginBottom:12,flexWrap:"wrap"}}>
          {[{k:"price",l:"Menor precio"},{k:"amount",l:"Mayor cantidad"},{k:"rating",l:"Mejor reputación"}].map(s=>(
            <button key={s.k} onClick={()=>setSortBy(s.k)}

        {/* listings */}
        {(Array.isArray(sorted)?sorted:[]).map((l,i)=>{
          const priceLocal  = (l.priceUSD*fx.rate).toFixed(cur==="USD"?4:2);

          const totalStr    = totalLocal>=1000?`${fx.sym}${(totalLocal/1000).toFixed(1)}k`:`${fx.sym}${totalLocal.toFixed(2)}`;
          const isBest      = i===0&&worldFilter==="Todos";

              {isBest&&<div style={{position:"absolute",top:8,right:10}}><span style={{background:`${C.gold}22`,color:C.gold,border:`1px solid ${C.gold}55`,padding:"2px 8px",borderRadius:4,fontSize:9,fontFamily:"'Cinzel',serif",fontWeight:700}}>MEJOR PRECIO</span></div>}

              <div style={{display:"flex",alignItems:"flex-start",gap:12,marginBottom:12}}>
                <div style={{width:44,height:44,borderRadius:"50%",background:"linear-gradient(135deg,#2A2010,#141008)",border:`1.5px solid ${l.online?C.green:C.border}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,position:"relative",flexShrink:0}}>
                  {VOC_ICON_TC[l.voc]||"🧙"}
                  {l.online&&<div style={{position:"absolute",bottom:1,right:1,width:10,height:10,borderRadius:"50%",background:C.green,border:`1.5px solid #141210`}}/>}

                <div style={{flex:1,minWidth:0}}>
                  <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:2,flexWrap:"wrap"}}>
                    <span style={{fontFamily:"'Cinzel',serif",fontWeight:700,fontSize:14,color:C.goldText}}>{l.seller}</span>

                  <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
                    <span style={{fontFamily:"'Cinzel',serif",fontSize:9,color:C.textMuted}}>⭐ {l.rating} ({l.trades} trades)</span>
                    {l.neg&&<span style={{fontSize:9,color:C.green}}>✓ Negociable</span>}
                  </div>
                </div>
              </div>

              {/* price grid */}
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6,marginBottom:10}}>
                <div style={{background:"#0E0D0A",borderRadius:8,padding:"8px 6px",textAlign:"center"}}>

                  <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:3}}>

                  </div>
                  <div style={{fontSize:8,color:C.textMuted}}>{fx.label}</div>
                </div>
                <div style={{background:"#0E0D0A",borderRadius:8,padding:"8px 6px",textAlign:"center"}}>
                  <div style={{fontFamily:"'Cinzel',serif",fontSize:7,color:C.textMuted,letterSpacing:0.3,marginBottom:3}}>CANTIDAD</div>

                  <div style={{fontSize:8,color:C.textMuted}}>TCs</div>
                </div>
                <div style={{background:"#0E0D0A",borderRadius:8,padding:"8px 6px",textAlign:"center"}}>
                  <div style={{fontFamily:"'Cinzel',serif",fontSize:7,color:C.textMuted,letterSpacing:0.3,marginBottom:3}}>TOTAL</div>
                  <div style={{fontFamily:"monospace",fontSize:13,fontWeight:700,color:C.textSub}}>{totalStr}</div>
                  <div style={{fontSize:8,color:C.textMuted}}>{fx.label}</div>
                </div>
              </div>

              <GoldBtn onClick={()=>onChat({seller:l.seller,amount:l.amount,priceUSD:l.priceUSD,img:"💎",name:`${l.amount} Tibia Coins`,price:l.amount})} small full={false}>
                💬 Contactar a {l.seller}
              </GoldBtn>
            </div>
          );
        })}

        {sorted.length===0&&(
          <div style={{textAlign:"center",padding:"48px 24px"}}>
            <div style={{fontSize:48,marginBottom:14,opacity:0.4}}>💎</div>
            <div style={{fontFamily:"'Cinzel',serif",fontSize:14,color:C.textSub,marginBottom:8}}>Sin ofertas de Tibia Coins</div>

            <div style={{marginTop:20}}>
              <GoldBtn onClick={onSell} full={false}>+ VENDER MIS TCs</GoldBtn>

        <div style={{height:8}}/>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════
   PIN SETUP — se muestra la primera vez
   ══════════════════════════════════════ */
function PinSetupScreen({character, onComplete}){
  const [pin,setPin]     = useState("");
  const [confirm,setConfirm] = useState("");
  const [step,setStep]   = useState("create"); // create | confirm | done
  const [shake,setShake] = useState(false);

  const VOC_ICON_P={Knight:"⚔️",Paladin:"🏹","Elder Druid":"🌿","Master Sorcerer":"🔮",Sorcerer:"🔮",Monk:"🥷"};

  function handleKey(val){
    if(step==="create"){
      if(val==="del"){ setPin(p=>p.slice(0,-1)); return; }
      if(pin.length>=4) return;
      const next = pin+val;
      setPin(next);
      if(next.length===4) setTimeout(()=>setStep("confirm"),300);
    } else {
      if(val==="del"){ setConfirm(c=>c.slice(0,-1)); return; }
      if(confirm.length>=4) return;
      const next = confirm+val;
      setConfirm(next);
      if(next.length===4){
        setTimeout(()=>{
          if(next===pin){
            setStep("done");
            setTimeout(()=>onComplete(pin),700);
          } else {
            setShake(true);
            setTimeout(()=>{ setConfirm(""); setShake(false); },600);
          }
        },200);
      }
    }
  }

  const display = step==="create" ? pin : confirm;
  const label   = step==="create" ? "Crea tu PIN de 4 dígitos" : "Confirma tu PIN";

  return(
    <AuthShell compact>
      <div style={{width:"100%",padding:"0 28px",animation:"fadeUp 0.4s ease",textAlign:"center"}}>
        <div style={{fontSize:32,marginBottom:8}}>{VOC_ICON_P[character?.voc]||"🧙"}</div>
        <div style={{fontFamily:"'Cinzel',serif",fontSize:13,fontWeight:700,color:C.goldText,marginBottom:4}}>{character?.name}</div>
        <div style={{fontSize:12,color:C.textSub,marginBottom:24,fontFamily:"'Crimson Text',serif"}}>{character?.voc} · {character?.world}</div>

        <div style={{fontFamily:"'Cinzel',serif",fontSize:11,color:C.textMuted,letterSpacing:1.5,marginBottom:16}}>
          {step==="done" ? "✓ PIN GUARDADO" : label.toUpperCase()}
        </div>

        {/* dots */}
        <div style={{display:"flex",justifyContent:"center",gap:16,marginBottom:32,animation:shake?"shake 0.5s ease":undefined}}>
          {[0,1,2,3].map(i=>(
            <div key={i} style={{
              width:16,height:16,borderRadius:"50%",
              background: display.length>i ? C.gold : "transparent",
              border:`2px solid ${display.length>i ? C.gold : C.borderGold}`,
              transition:"all 0.15s",
              transform: display.length===i+1 ? "scale(1.3)" : "scale(1)",
            }}/>
          ))}
        </div>

        {step!=="done" && <Numpad onKey={handleKey}/>}

        {step==="create"&&(
          <button onClick={()=>onComplete(null)}
            style={{background:"none",border:"none",color:C.textMuted,fontFamily:"'Cinzel',serif",fontSize:10,letterSpacing:0.5,cursor:"pointer",marginTop:16}}>
            OMITIR POR AHORA
          </button>
        )}
      </div>
    </AuthShell>
  );
}

/* ══════════════════════════════════════

function PinEntryScreen({session, onSuccess, onForget}){
  const [pin,setPin]   = useState("");
  const [shake,setShake] = useState(false);
  const [tries,setTries]   = useState(0);
  const [blocked,setBlocked] = useState(false);
  const [blockTime,setBlockTime] = useState(0);

  const VOC_ICON_P={Knight:"⚔️",Paladin:"🏹","Elder Druid":"🌿","Master Sorcerer":"🔮",Sorcerer:"🔮",Monk:"🥷"};
  const char = session?.character;

  async function handleKey(val){
    if(val==="del"){ setPin(p=>p.slice(0,-1)); return; }
    if(pin.length>=4) return;
    const next = pin+val;
    setPin(next);
    if(next.length===4){
      const hashed = await hashPin(next);
      setTimeout(()=>{
        if(hashed===session?.pin){
          onSuccess();
        } else {
          const newTries = tries + 1;
          setShake(true);
          setTries(newTries);
          if(newTries >= 5){
            setBlocked(true);
            const until = Date.now() + 30000; // 30 seg bloqueado
            setBlockTime(until);
            setTimeout(()=>{ setBlocked(false); setTries(0); setPin(""); setShake(false); }, 30000);
          } else {
            setTimeout(()=>{ setPin(""); setShake(false); },600);
          }
        }
      },200);
    }
  }

  return(
    <AuthShell compact>
      <div style={{width:"100%",padding:"0 28px",animation:"fadeUp 0.4s ease",textAlign:"center"}}>
        <div style={{fontSize:32,marginBottom:8}}>{VOC_ICON_P[char?.voc]||"🧙"}</div>
        <div style={{fontFamily:"'Cinzel',serif",fontSize:14,fontWeight:700,color:C.goldText,marginBottom:4}}>{char?.name}</div>
        <div style={{fontSize:12,color:C.textSub,marginBottom:4,fontFamily:"'Crimson Text',serif"}}>{char?.voc} · {char?.world} · Lvl {char?.level}</div>
        {tries>0&&<div style={{fontSize:11,color:C.red,marginBottom:4,fontFamily:"'Crimson Text',serif"}}>PIN incorrecto. Intenta de nuevo.</div>}

        <div style={{fontFamily:"'Cinzel',serif",fontSize:11,color:C.textMuted,letterSpacing:1.5,marginBottom:16,marginTop:12}}>
          INGRESA TU PIN
        </div>

        {/* dots */}
        <div style={{display:"flex",justifyContent:"center",gap:16,marginBottom:32,animation:shake?"shake 0.5s ease":undefined}}>
          {[0,1,2,3].map(i=>(
            <div key={i} style={{
              width:16,height:16,borderRadius:"50%",
              background: pin.length>i ? C.gold : "transparent",
              border:`2px solid ${pin.length>i ? C.gold : C.borderGold}`,
              transition:"all 0.15s",
              transform: pin.length===i+1 ? "scale(1.3)" : "scale(1)",
            }}/>
          ))}
        </div>

        <Numpad onKey={handleKey}/>

        <button onClick={onForget}
          style={{background:"none",border:"none",color:C.textMuted,fontFamily:"'Cinzel',serif",fontSize:10,letterSpacing:0.5,cursor:"pointer",marginTop:16}}>
          ¿OLVIDASTE TU PIN? USAR NOMBRE DE PERSONAJE
        </button>
      </div>
    </AuthShell>
  );
}

/* ── Teclado numérico compartido ── */
function Numpad({onKey}){
  const keys=["1","2","3","4","5","6","7","8","9","","0","del"];
  return(
    <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:12,maxWidth:220,margin:"0 auto"}}>
      {keys.map((k,i)=>(
        k===""
          ? <div key={i}/>
          : <button key={i} onClick={()=>onKey(k)}
              style={{
                background: k==="del" ? "transparent" : "linear-gradient(180deg,#201E16,#181510)",
                border:`1.5px solid ${k==="del"?"transparent":C.borderGold}`,
                borderRadius:12,
                padding:"14px 0",
                color: k==="del" ? C.textMuted : C.text,
                fontFamily:"'Cinzel',serif",
                fontSize: k==="del" ? 18 : 20,
                fontWeight:700,
                cursor:"pointer",
                transition:"all 0.1s",
                boxShadow: k==="del"?"none":"0 2px 8px #00000044",
              }}
              onPointerDown={e=>e.currentTarget.style.transform="scale(0.93)"}
              onPointerUp={e=>e.currentTarget.style.transform="scale(1)"}
              onPointerLeave={e=>e.currentTarget.style.transform="scale(1)"}
            >
              {k==="del" ? "⌫" : k}
            </button>
      ))}
    </div>
  );
}

function App(){
  // Check session synchronously before first render
  const _savedSession = (()=>{ try{ return Session.load(); }catch{ return null; } })();
  const [view,setView]     = useState(_savedSession?.character ? (_savedSession?.pin ? "pinEntry" : "app") : "loading");
  const [tab,setTab]       = useState("market");
  const [selItem,setSelItem]   = useState(null);
  const [chatItem,setChatItem] = useState(null);
  const [subView,setSubView]   = useState("main");
  const [session,setSession]   = useState(null);   // { character, user, token }

  // ── Data states ──
  const [itemListings,setItemListings]   = useState(null);  // null = loading
  const [tcListings,setTcListings]       = useState(null);
  const [charListings,setCharListings]   = useState(null);
  const [myListings,setMyListings]       = useState([]);
  const [conversations,setConversations] = useState([]);

  /* ── On mount: check saved session ── */
  useEffect(()=>{
    const saved = Session.load();
    if(saved?.character){
      setSession(saved);
      setView(saved?.pin ? "pinEntry" : "app");
    } else {
      setView("login");
    }
  },[]);  // eslint-disable-line

  /* ── Load market data (items, TC, chars) ── */
  useEffect(()=>{
    if(view!=="app") return;
    loadAllData();
  },[view]); // eslint-disable-line

  async function loadAllData(){
    // Usar fetch directo (sin Authorization header) para evitar CORS preflight en endpoints públicos
    async function publicFetch(path){
      const res = await fetch(API_URL + path, {headers:{"Accept":"application/json"}});
      if(!res.ok) throw new Error("HTTP " + res.status);
      const ct = res.headers.get("content-type")||"";
      if(!ct.includes("json")) throw new Error("Not JSON");
      return res.json();
    }

    if(!API_URL){ 
      setItemListings([]);
      setTcListings([]);
      setCharListings([]);
      return;
    }

    // Items — mostrar vacío si no hay publicaciones, nunca items de demo
    try{ const d=await publicFetch("/api/listings?limit=50"); setItemListings(Array.isArray(d.listings)?d.listings:[]); }
    catch(e){ console.warn("listings fetch failed:",e.message); setItemListings([]); }

    // TC
    try{ const d=await publicFetch("/api/tc?limit=20"); setTcListings(Array.isArray(d.listings)?d.listings:[]); }
    catch(e){ console.warn("tc fetch failed:",e.message); setTcListings([]); }

    // Bazar de chars — vacío hasta que usuarios publiquen
    setCharListings([]);
  }

  /* ── After user publishes something, reload ── */
  function onPublished(){
    setItemListings(null);
    setTimeout(loadAllData, 500);
  }

  /* ── Auth handlers ── */
  function handleLogin(character){
    // Save session immediately — this persists for 30 days
    const sessionData = { character: character||{}, savedAt: Date.now() };
    Session.save(sessionData);
    setSession(sessionData);
    setView("pinSetup"); // Pedir PIN antes de entrar
    // Register/login on backend in background (non-blocking)
    if(API_URL){
      const endpoint = character.hasAccount ? "/api/auth/login" : "/api/auth/register";
      fetch(API_URL + endpoint, {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({characterName: character.name})
      }).then(r=>r.json()).then(data=>{
        if(data.token){
          const updated = {...sessionData, token: data.token};
          Session.save(updated);
          setSession(updated);
        }
      }).catch(e=>console.warn("Backend auth:", e.message));
    }
  }
  async function handlePinComplete(pin){
    // pin puede ser null si el usuario omitió
    const saved = Session.load();
    if(saved && pin){
      const hashed = await hashPin(pin);
      const updated = {...saved, pin: hashed};
      Session.save(updated);
      setSession(updated);
    }
    setView("app");
  }
  function handlePinSuccess(){
    // PIN correcto — entrar a la app
    setView("app");
  }
  function handlePinForget(){
    // Borrar PIN guardado y pedir nombre de personaje de nuevo
    const saved = Session.load();
    if(saved){
      const {pin:_removed, ...rest} = saved;
      Session.save(rest);
      setSession(rest);
    }
    setView("login");
  }
  function handleLogout(){
    Session.clear();
    setSession(null);
    setItemListings(null);
    setTcListings(null);
    setCharListings(null);
    setView("login");
    setTab("market");
    setSubView("main");
  }

  /* ── Navigation ── */
  function goItem(item){ setSelItem(item); setSubView("detail"); }
  function goChat(item){ setChatItem(item); setSubView("chat"); }
  function goBack(){ setSubView("main"); setSelItem(null); setChatItem(null); }
  function changeTab(t){ setTab(t); setSubView("main"); setChatItem(null); }

  /* ── Screens ── */
  if(view==="loading")  return <LoadingScreen message="Iniciando Tibia Market..."/>;
  if(view==="login")    return <LoginScreen onLogin={handleLogin} onRegister={()=>setView("register")}/>;
  if(view==="register") return <RegisterScreen onLogin={()=>setView("login")} onSuccess={handleLogin}/>;
  if(view==="pinSetup") return <PinSetupScreen character={session?.character} onComplete={handlePinComplete}/>;
  if(view==="pinEntry") return <PinEntryScreen session={session||Session.load()} onSuccess={handlePinSuccess} onForget={handlePinForget}/>;

  function renderScreen(){
    if(subView==="detail"&&selItem)
      return <DetailScreen item={selItem} onBack={goBack} onChat={()=>goChat(selItem)}/>;
    if(subView==="chat")
      return <ChatScreen item={chatItem} onBack={goBack}/>;
    if(subView==="tcmarket")
      return <TCMarketScreen tcListings={tcListings||[]} loading={!tcListings} onBack={goBack} onSell={()=>setSubView("selltc")} onChat={(item)=>{setChatItem(item);setSubView("chat");}}/>;
    if(subView==="selltc")
      return <SellTCScreen onBack={()=>setSubView("tcmarket")} onPublished={onPublished}/>;
    if(subView==="bazaar")
      return <BazaarScreen charListings={charListings||[]} loading={!charListings} onBack={goBack} onSell={()=>setSubView("sellchar")} onChat={(item)=>{setChatItem(item);setSubView("chat");}}/>;
    if(subView==="sellchar")
      return <SellCharScreen onBack={()=>setSubView("bazaar")} onPublished={onPublished}/>;
    if(tab==="market")
      return <MarketScreen items={itemListings} loadingItems={!itemListings} onItem={goItem} onProfile={()=>changeTab("account")} onTCMarket={()=>setSubView("tcmarket")} onBazaar={()=>setSubView("bazaar")} session={session}/>;
    if(tab==="sell")
      return <SellScreen onPublished={onPublished}/>;
    if(tab==="offers")
      return <ChatScreen inbox conversations={conversations}/>;
    if(tab==="account")
      return <AccountScreen session={session} myListings={myListings} onBack={()=>changeTab("market")} onLogout={handleLogout}/>;
    if(tab==="settings")
      return <SettingsScreen/>;
    return null;
  }

  return(
    <div style={{background:C.bg0,height:"100vh",display:"flex",flexDirection:"column",fontFamily:"'Crimson Text',Georgia,serif",color:C.text,overflow:"hidden",position:"fixed",inset:0,maxWidth:430,margin:"0 auto"}}>
      <div style={{flex:1,overflow:"hidden",display:"flex",flexDirection:"column",minHeight:0}}>{renderScreen()}</div>
      <BottomNav tab={tab} setTab={changeTab}/>
    </div>
  );
}


class ErrorBoundary extends React.Component {
  constructor(props){ super(props); this.state={error:null}; }
  static getDerivedStateFromError(err){ return {error:err}; }
  componentDidCatch(err,info){
    console.error("React Error:", err, info);
  }
  render(){
    if(this.state.error){
      const err = this.state.error;
      return(
        <div style={{color:"#D4A830",padding:30,fontFamily:"monospace",background:"#0E0D0A",minHeight:"100vh"}}>
          <h2>⚔️ Tibia Market — Error de renderizado</h2>
          <p style={{color:"#F87171",marginTop:10}}><b>{err.name}:</b> {err.message}</p>
          <pre style={{fontSize:11,color:"#aaa",whiteSpace:"pre-wrap",marginTop:10,maxHeight:300,overflow:"auto"}}>{err.stack}</pre>
          <button onClick={()=>this.setState({error:null})} style={{marginTop:20,background:"#C9A020",color:"#000",border:"none",padding:"8px 16px",cursor:"pointer",fontFamily:"'Cinzel',serif"}}>REINTENTAR</button>
        </div>
      );
    }
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById("root")).render(<ErrorBoundary><App/></ErrorBoundary>);
</script>
</body>
</html>
